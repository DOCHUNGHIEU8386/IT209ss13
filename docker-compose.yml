version: '3.8'

services:
  # Database Service: MySQL 8
  database:
    image: mysql:8.0
    container_name: campushub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-campushub}
      MYSQL_USER: ${DB_USER:-campus_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-campus_pass123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - campushub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service: Spring Boot 3 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub-backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-campushub}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - campushub-network

  # Frontend Service: React Vite with Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campushub-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - campushub-network

networks:
  campushub-network:
    driver: bridge

volumes:
  mysql_data:
